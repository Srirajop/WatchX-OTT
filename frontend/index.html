<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SubtitleAI — Cleaning & Quality Check</title>
  <script>
    window.addEventListener('error', function(e) {
      document.body.innerHTML += '<div style="color:red;font-size:24px;padding:20px;background:white;position:fixed;top:0;left:0;z-index:999999;border-bottom:5px solid red;width:100%;box-shadow:0 10px 30px rgba(0,0,0,0.5);"><strong>REACT CRASH:</strong> ' + e.message + '<br><br><small>' + e.filename + ':' + e.lineno + '</small></div>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.body.innerHTML += '<div style="color:red;font-size:24px;padding:20px;background:white;position:fixed;top:0;left:0;z-index:999999;border-bottom:5px solid red;width:100%;box-shadow:0 10px 30px rgba(0,0,0,0.5);"><strong>PROMISE REJECTION:</strong> ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</div>';
    });
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; } 
    body { background: #f8fafc; color: #0f172a; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; } 
    i { font-style: italic; color: #4f46e5; font-weight: bold; } 
    b { font-weight: bold; color: #4f46e5; }
    button, .card, .uploadZone { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.2), 0 4px 6px -4px rgba(79, 70, 229, 0.1); }
    button:active:not(:disabled) { transform: translateY(0); }
    .card:hover { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); }
    input:focus, select:focus, textarea:focus { border-color: #4f46e5 !important; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); outline: none; }
    /* Micro animations for icons */
    .icon-spin:hover { transform: rotate(180deg); transition: transform 0.3s ease; }
    .btn-x-hover:hover { background: #fee2e2; color: #dc2626 !important; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(1.3)} }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
